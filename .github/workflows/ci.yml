name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: productized_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d productized_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRODUCTIZED_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/productized_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt "bandit>=1.8,<2" "pip-audit==2.10.1"
      - run: python -m pip_audit -r requirements.txt --strict
      - run: bandit -q -r app -ll
      - run: PYTHONPATH=. pytest -q
